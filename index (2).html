<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Site Monitor — Monitoring Photo Search</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react"
  }
}
</script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useEffect, useMemo, useRef, useCallback } from "react";
import { createRoot } from "react-dom/client";
import {
  Search, Plus, X, MapPin, Calendar, Hash, ArrowUp, ArrowDown,
  ArrowUpDown, Image as ImageIcon, Building2, Menu as MenuIcon, Upload, ChevronRight
} from "lucide-react";


// ---------- backend: paste your deployed Apps Script Web App URL here ----------
// See apps-script-backend.gs for the code that goes with this.
// This single URL is used both to READ the live sheet data (GET) and to
// WRITE new entries (POST). Leave as-is to keep running in local-only demo mode.
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJntnxypKbId06p05ryjGW5-JXHS2x78K68SnBU7Xiy7VS5JDsNy9Z94pb6jjzzj-D/exec";

// ---------- design tokens (field-ops / route-log aesthetic) ----------
const FONT_IMPORT = `
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
`;

const INK = "#1B2430";
const PAPER = "#F0F1EC";
const CARD = "#FAF9F5";
const ROUTE_GREEN = "#1F6F4A";
const CAUTION = "#D98E2B";
const ROUTE_BLUE = "#31527A";
const LINE = "#DAD7CE";

// ---------- deterministic placeholder swatch colors per brand ----------
const SWATCHES = ["#B7C9BE", "#D8C9A3", "#B9C4D0", "#CBB8A6", "#A9BBB0", "#D3C3B0"];
function swatchFor(seed) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  return SWATCHES[h % SWATCHES.length];
}

const DEPARTMENTS = ["Field Ops", "Client Relations", "Compliance", "Marketing"];
const DIRECTIONS = ["NB", "SB", "NBSB"];

function rowToEntry(row, idx) {
  const count = parseInt(row["Photo Count"], 10) || 1;
  const shown = Math.min(count, 6);
  return {
    id: `sheet-${idx}`,
    brand: (row["Brand"] || "").trim(),
    site: (row["Site"] || "").trim(),
    panel: (row["Panel"] || "").trim(),
    direction: (row["Direction"] || "").trim(),
    date: (row["Date"] || "").trim(),
    department: (row["Department"] || "").trim() || "Unassigned",
    folderLink: (row["Folder Link"] || "").trim(),
    needsReview: (row["Needs Review"] || "").trim().toUpperCase() === "YES",
    photoCount: count,
    photos: Array.from({ length: shown }, (_, p) => ({
      id: `${idx}-${p}`,
      color: swatchFor((row["Brand"] || "") + p),
    })),
  };
}

function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("en-US", { month: "2-digit", day: "2-digit", year: "2-digit" });
}

// ---------- route-marker badge (signature element) ----------
function RouteBadge({ direction }) {
  const arrow = direction === "NB" ? <ArrowUp size={11} /> : direction === "SB" ? <ArrowDown size={11} /> : <ArrowUpDown size={11} />;
  return (
    <span
      className="inline-flex items-center gap-1 px-2 py-0.5 rounded-[3px] text-[11px] font-medium tracking-wide"
      style={{ background: ROUTE_GREEN, color: "#F5F4EF", fontFamily: "'IBM Plex Mono', monospace" }}
    >
      {arrow}{direction}
    </span>
  );
}

// ---------- inspection-stamp date tag (signature element) ----------
function DateStamp({ date }) {
  return (
    <div
      className="absolute -top-2 -right-2 rotate-[6deg] px-2 py-1 rounded-sm shadow-sm border text-[10px] font-medium"
      style={{ background: "#F5F4EF", borderColor: LINE, color: INK, fontFamily: "'IBM Plex Mono', monospace" }}
    >
      {fmtDate(date)}
    </div>
  );
}

function SiteCard({ entry, onOpen }) {
  const visible = entry.photos.slice(0, 3);
  const extra = entry.photos.length - visible.length;
  return (
    <button
      onClick={() => onOpen(entry)}
      className="relative text-left rounded-lg border p-4 flex flex-col gap-3 transition-transform hover:-translate-y-0.5 hover:shadow-md focus:outline-none focus-visible:ring-2"
      style={{ background: CARD, borderColor: LINE, fontFamily: "'Inter', sans-serif" }}
    >
      <DateStamp date={entry.date} />
      <div className="flex items-center justify-between">
        <span
          className="text-[11px] uppercase tracking-widest font-medium"
          style={{ color: CAUTION }}
        >
          {entry.brand}
        </span>
        <RouteBadge direction={entry.direction} />
      </div>
      <h3
        className="text-[19px] leading-tight uppercase"
        style={{ fontFamily: "'Oswald', sans-serif", color: INK, letterSpacing: "0.01em" }}
      >
        {entry.site}{entry.panel ? ` · Panel ${entry.panel}` : ""}
      </h3>
      <div className="flex gap-1.5">
        {visible.map((p) => (
          <div key={p.id} className="w-12 h-12 rounded-md flex items-center justify-center" style={{ background: p.color }}>
            <ImageIcon size={16} color="rgba(27,36,48,0.45)" />
          </div>
        ))}
        {extra > 0 && (
          <div className="w-12 h-12 rounded-md flex items-center justify-center text-[12px] font-medium" style={{ background: PAPER, color: INK, fontFamily: "'IBM Plex Mono', monospace" }}>
            +{extra}
          </div>
        )}
      </div>
      <div className="flex items-center justify-between pt-1 border-t" style={{ borderColor: LINE }}>
        <span className="text-[11px]" style={{ color: ROUTE_BLUE, fontFamily: "'IBM Plex Mono', monospace" }}>
          {entry.department}
        </span>
        <span className="text-[11px] flex items-center gap-0.5" style={{ color: INK, opacity: 0.5 }}>
          {entry.photos.length} photos <ChevronRight size={12} />
        </span>
      </div>
    </button>
  );
}

// ---------- detail / gallery lightbox ----------
function DetailPanel({ entry, onClose }) {
  if (!entry) return null;
  return (
    <div className="fixed inset-0 z-[200] flex items-end sm:items-center justify-center p-0 sm:p-6" style={{ background: "rgba(27,36,48,0.55)" }} onClick={onClose}>
      <div
        className="w-full sm:max-w-2xl max-h-[85vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl p-6 flex flex-col gap-4"
        style={{ background: CARD, fontFamily: "'Inter', sans-serif" }}
        onClick={(e) => e.stopPropagation()}
      >
        <div className="flex items-start justify-between">
          <div>
            <span className="text-[11px] uppercase tracking-widest font-medium" style={{ color: CAUTION }}>{entry.brand}</span>
            <h2 className="text-[26px] uppercase leading-none mt-1" style={{ fontFamily: "'Oswald', sans-serif", color: INK }}>
              {entry.site}{entry.panel ? ` · Panel ${entry.panel}` : ""}
            </h2>
          </div>
          <button onClick={onClose} className="p-1.5 rounded-full hover:bg-black/5"><X size={18} color={INK} /></button>
        </div>
        <div className="flex flex-wrap gap-2">
          <RouteBadge direction={entry.direction} />
          <span className="text-[11px] px-2 py-0.5 rounded-[3px] border" style={{ borderColor: LINE, color: INK, fontFamily: "'IBM Plex Mono', monospace" }}>{fmtDate(entry.date)}</span>
          <span className="text-[11px] px-2 py-0.5 rounded-[3px]" style={{ background: ROUTE_BLUE, color: "#F5F4EF", fontFamily: "'IBM Plex Mono', monospace" }}>{entry.department}</span>
          {entry.needsReview && (
            <span className="text-[11px] px-2 py-0.5 rounded-[3px]" style={{ background: CAUTION, color: "#F5F4EF", fontFamily: "'IBM Plex Mono', monospace" }}>Needs review — check date</span>
          )}
        </div>
        {entry.folderLink ? (
          <a href={entry.folderLink} target="_blank" rel="noreferrer" className="text-[13px] underline w-fit" style={{ color: ROUTE_GREEN, fontFamily: "'Inter', sans-serif" }}>
            Open full folder in Drive →
          </a>
        ) : (
          <p className="text-[12px]" style={{ color: INK, opacity: 0.45, fontFamily: "'Inter', sans-serif" }}>
            No Drive link set yet for this entry — add one in the "Folder Link" column of the Sheet.
          </p>
        )}
        <div className="grid grid-cols-3 sm:grid-cols-4 gap-2">
          {entry.photos.map((p) => (
            <div key={p.id} className="aspect-square rounded-md flex items-center justify-center" style={{ background: p.color }}>
              <ImageIcon size={20} color="rgba(27,36,48,0.4)" />
            </div>
          ))}
        </div>
        {entry.photoCount > entry.photos.length && (
          <p className="text-[11px] -mt-2" style={{ color: INK, opacity: 0.5, fontFamily: "'IBM Plex Mono', monospace" }}>
            Showing {entry.photos.length} of {entry.photoCount} photos — open the Drive folder to see all.
          </p>
        )}
      </div>
    </div>
  );
}

// ---------- add-entry modal ----------
function AddEntryModal({ onClose, onSave }) {
  const [form, setForm] = useState({ brand: "", site: "", panel: "", direction: "NB", date: "", department: DEPARTMENTS[0] });
  const [files, setFiles] = useState([]);
  const [submitting, setSubmitting] = useState(false);
  const fileRef = useRef(null);

  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  const handleFiles = (e) => {
    const list = Array.from(e.target.files || []).map((file, i) => ({
      id: `${Date.now()}-${i}`,
      url: URL.createObjectURL(file),
      file,
    }));
    setFiles((prev) => [...prev, ...list]);
  };

  const canSave = form.brand.trim() && form.site.trim() && form.date;

  return (
    <div className="fixed inset-0 z-[200] flex items-end sm:items-center justify-center p-0 sm:p-6" style={{ background: "rgba(27,36,48,0.55)" }} onClick={onClose}>
      <div
        className="w-full sm:max-w-lg max-h-[90vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl p-6 flex flex-col gap-4"
        style={{ background: CARD, fontFamily: "'Inter', sans-serif" }}
        onClick={(e) => e.stopPropagation()}
      >
        <div className="flex items-center justify-between">
          <h2 className="text-[22px] uppercase" style={{ fontFamily: "'Oswald', sans-serif", color: INK }}>New Site Entry</h2>
          <button onClick={onClose} className="p-1.5 rounded-full hover:bg-black/5"><X size={18} color={INK} /></button>
        </div>

        <div className="grid grid-cols-2 gap-3">
          <label className="flex flex-col gap-1 col-span-2">
            <span className="text-[11px] uppercase tracking-wide" style={{ color: INK, opacity: 0.6 }}>Brand</span>
            <input value={form.brand} onChange={set("brand")} placeholder="e.g. BYD" className="px-3 py-2 rounded-md border text-[14px] focus:outline-none focus:ring-2" style={{ borderColor: LINE }} />
          </label>
          <label className="flex flex-col gap-1 col-span-2">
            <span className="text-[11px] uppercase tracking-wide" style={{ color: INK, opacity: 0.6 }}>Site / Location</span>
            <input value={form.site} onChange={set("site")} placeholder="e.g. Balintawak" className="px-3 py-2 rounded-md border text-[14px] focus:outline-none focus:ring-2" style={{ borderColor: LINE }} />
          </label>
          <label className="flex flex-col gap-1">
            <span className="text-[11px] uppercase tracking-wide" style={{ color: INK, opacity: 0.6 }}>Panel #</span>
            <input value={form.panel} onChange={set("panel")} placeholder="1" className="px-3 py-2 rounded-md border text-[14px] focus:outline-none focus:ring-2" style={{ borderColor: LINE }} />
          </label>
          <label className="flex flex-col gap-1">
            <span className="text-[11px] uppercase tracking-wide" style={{ color: INK, opacity: 0.6 }}>Direction</span>
            <select value={form.direction} onChange={set("direction")} className="px-3 py-2 rounded-md border text-[14px] focus:outline-none focus:ring-2" style={{ borderColor: LINE }}>
              {DIRECTIONS.map((d) => <option key={d} value={d}>{d}</option>)}
            </select>
          </label>
          <label className="flex flex-col gap-1">
            <span className="text-[11px] uppercase tracking-wide" style={{ color: INK, opacity: 0.6 }}>Date</span>
            <input type="date" value={form.date} onChange={set("date")} className="px-3 py-2 rounded-md border text-[14px] focus:outline-none focus:ring-2" style={{ borderColor: LINE }} />
          </label>
          <label className="flex flex-col gap-1">
            <span className="text-[11px] uppercase tracking-wide" style={{ color: INK, opacity: 0.6 }}>Department</span>
            <select value={form.department} onChange={set("department")} className="px-3 py-2 rounded-md border text-[14px] focus:outline-none focus:ring-2" style={{ borderColor: LINE }}>
              {DEPARTMENTS.map((d) => <option key={d} value={d}>{d}</option>)}
            </select>
          </label>
        </div>

        <div className="flex flex-col gap-2">
          <span className="text-[11px] uppercase tracking-wide" style={{ color: INK, opacity: 0.6 }}>Photos</span>
          <button
            onClick={() => fileRef.current?.click()}
            className="flex items-center justify-center gap-2 py-4 rounded-md border border-dashed text-[13px]"
            style={{ borderColor: LINE, color: INK }}
          >
            <Upload size={15} /> Click to add photos
          </button>
          <input ref={fileRef} type="file" accept="image/*" multiple className="hidden" onChange={handleFiles} />
          {files.length > 0 && (
            <div className="grid grid-cols-4 gap-1.5">
              {files.map((f) => (
                <img key={f.id} src={f.url} alt="" className="aspect-square object-cover rounded-md" />
              ))}
            </div>
          )}
        </div>

        <button
          disabled={!canSave || submitting}
          onClick={async () => {
            setSubmitting(true);
            await onSave(form, files);
            setSubmitting(false);
          }}
          className="mt-2 py-2.5 rounded-md text-[13px] font-medium uppercase tracking-wide disabled:opacity-40"
          style={{ background: ROUTE_GREEN, color: "#F5F4EF", fontFamily: "'IBM Plex Mono', monospace" }}
        >
          {submitting ? "Saving to Drive + Sheet..." : "Save Entry"}
        </button>
      </div>
    </div>
  );
}

// ---------- floating action menu (liquid-morph style, CSS-only) ----------
function FloatingMenu({ onSearch, onAdd }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    if (!open) return;
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, [open]);

  return (
    <div ref={ref} className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[150]">
      <div
        className="relative overflow-hidden flex flex-col justify-end transition-all duration-500 ease-out shadow-lg"
        style={{
          width: open ? 220 : 150,
          height: open ? 168 : 48,
          borderRadius: open ? 24 : 999,
          background: INK,
        }}
      >
        <div
          className="flex flex-col gap-1 px-4 pt-4 transition-opacity duration-300"
          style={{ opacity: open ? 1 : 0, pointerEvents: open ? "auto" : "none" }}
        >
          <button
            onClick={() => { setOpen(false); onSearch(); }}
            className="text-left text-[13px] py-1.5 flex items-center gap-2"
            style={{ color: "#F5F4EF", fontFamily: "'Inter', sans-serif" }}
          >
            <Search size={14} /> Jump to search
          </button>
          <button
            onClick={() => { setOpen(false); onAdd(); }}
            className="text-left text-[13px] py-1.5 flex items-center gap-2"
            style={{ color: "#F5F4EF", fontFamily: "'Inter', sans-serif" }}
          >
            <Plus size={14} /> New site entry
          </button>
        </div>
        <button
          onClick={() => setOpen((v) => !v)}
          className="flex items-center justify-between w-full px-5 shrink-0"
          style={{ height: 48 }}
        >
          <span className="text-[13px]" style={{ color: "#F5F4EF", fontFamily: "'Inter', sans-serif" }}>Menu</span>
          <div className="relative w-4 h-4 flex items-center justify-center">
            <span
              className="absolute block w-3.5 h-[1.5px] rounded-full bg-[#F5F4EF] transition-transform duration-300"
              style={{ transform: open ? "rotate(45deg)" : "translateY(-2.5px)" }}
            />
            <span
              className="absolute block w-3.5 h-[1.5px] rounded-full bg-[#F5F4EF] transition-transform duration-300"
              style={{ transform: open ? "rotate(-45deg)" : "translateY(2.5px)" }}
            />
          </div>
        </button>
      </div>
    </div>
  );
}

// ---------- main app ----------
function MonitoringDashboard() {
  const [entries, setEntries] = useState([]);
  const [loadingSheet, setLoadingSheet] = useState(true);
  const [loadError, setLoadError] = useState(false);
  const [query, setQuery] = useState("");
  const [direction, setDirection] = useState("All");
  const [department, setDepartment] = useState("All");
  const [detail, setDetail] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const searchRef = useRef(null);

  // fetch live data from the Apps Script backend (falls back to local demo mode if not configured)
  useEffect(() => {
    let cancelled = false;
    (async () => {
      if (!APPS_SCRIPT_URL || !APPS_SCRIPT_URL.startsWith("http")) {
        if (!cancelled) { setLoadingSheet(false); setLoadError(true); }
        return;
      }
      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const data = await res.json();
        const sheetEntries = data.map(rowToEntry).filter((e) => e.brand);
        if (!cancelled) setEntries(sheetEntries);
      } catch (err) {
        console.error("Could not load from the Apps Script backend — is it deployed and is APPS_SCRIPT_URL set?", err);
        if (!cancelled) setLoadError(true);
      } finally {
        if (!cancelled) setLoadingSheet(false);
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // layer in any locally-added demo entries (only relevant if the Apps Script backend isn't wired up yet)
  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage?.get("custom-entries", false);
        if (res?.value) {
          const parsedCustom = JSON.parse(res.value);
          setEntries((prev) => [...parsedCustom, ...prev]);
        }
      } catch (e) {
        // no local demo entries saved
      }
    })();
  }, []);

  const persist = useCallback(async (list) => {
    try {
      await window.storage?.set("custom-entries", JSON.stringify(list), false);
    } catch (e) {
      console.error("Could not save entry", e);
    }
  }, []);

  const fileToBase64 = (file) =>
    new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

  const handleSave = async (form, files) => {
    const entry = {
      id: `custom-${Date.now()}`,
      brand: form.brand.trim(),
      site: form.site.trim(),
      panel: form.panel.trim(),
      direction: form.direction,
      date: form.date,
      department: form.department,
      photos: files.length
        ? files.map((f) => ({ id: f.id, color: swatchFor(form.brand + f.id), previewUrl: f.url }))
        : [{ id: "placeholder", color: swatchFor(form.brand) }],
    };

    // send to the real backend (Drive + Sheet) if it's been configured
    if (APPS_SCRIPT_URL && APPS_SCRIPT_URL.startsWith("http")) {
      try {
        const photosPayload = await Promise.all(
          files.map(async (f) => ({
            name: f.file.name,
            mimeType: f.file.type,
            base64Data: await fileToBase64(f.file),
          }))
        );
        await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          // text/plain avoids a CORS preflight that Apps Script doesn't handle
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ ...form, photos: photosPayload }),
        });
      } catch (err) {
        console.error("Could not reach the backend — entry saved locally only.", err);
      }
    }

    // also reflect it immediately in the UI + local demo cache
    setEntries((prev) => {
      const custom = prev.filter((e) => e.id.startsWith("custom-"));
      const next = [entry, ...custom];
      persist(next);
      return [entry, ...prev];
    });
    setShowAdd(false);
  };

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return entries.filter((e) => {
      if (direction !== "All" && e.direction !== direction) return false;
      if (department !== "All" && e.department !== department) return false;
      if (!q) return true;
      const haystack = `${e.brand} ${e.site} ${e.panel} ${e.direction} ${e.date} ${fmtDate(e.date)}`.toLowerCase();
      return haystack.includes(q);
    });
  }, [entries, query, direction, department]);

  return (
    <div className="min-h-screen w-full pb-32" style={{ background: PAPER }}>
      <style>{FONT_IMPORT}</style>

      {/* header */}
      <header className="px-6 sm:px-10 py-6 flex items-center justify-between border-b" style={{ borderColor: LINE }}>
        <div className="flex items-center gap-2">
          <div className="w-8 h-8 rounded-md flex items-center justify-center" style={{ background: ROUTE_GREEN }}>
            <MapPin size={16} color="#F5F4EF" />
          </div>
          <span className="text-[18px] uppercase tracking-wide" style={{ fontFamily: "'Oswald', sans-serif", color: INK }}>
            Site Monitor
          </span>
        </div>
        <span className="text-[12px]" style={{ fontFamily: "'IBM Plex Mono', monospace", color: INK, opacity: 0.55 }}>
          {entries.length} entries logged
        </span>
      </header>

      {/* search / filter console */}
      <div className="px-6 sm:px-10 py-6 flex flex-col gap-3">
        <div className="relative">
          <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2" color={INK} style={{ opacity: 0.4 }} />
          <input
            ref={searchRef}
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            placeholder="Type a brand, site, panel number, or date (e.g. BYD, Balintawak, 07/17/26)..."
            className="w-full pl-10 pr-4 py-3 rounded-lg border text-[14px] focus:outline-none focus:ring-2"
            style={{ background: CARD, borderColor: LINE, fontFamily: "'Inter', sans-serif" }}
          />
        </div>
        <div className="flex flex-wrap gap-2 items-center">
          <span className="text-[11px] uppercase tracking-wide mr-1" style={{ color: INK, opacity: 0.5, fontFamily: "'IBM Plex Mono', monospace" }}>Direction</span>
          {["All", ...DIRECTIONS].map((d) => (
            <button
              key={d}
              onClick={() => setDirection(d)}
              className="px-2.5 py-1 rounded-full text-[12px] border transition-colors"
              style={{
                background: direction === d ? ROUTE_GREEN : "transparent",
                color: direction === d ? "#F5F4EF" : INK,
                borderColor: direction === d ? ROUTE_GREEN : LINE,
                fontFamily: "'IBM Plex Mono', monospace",
              }}
            >
              {d}
            </button>
          ))}
          <span className="text-[11px] uppercase tracking-wide ml-3 mr-1" style={{ color: INK, opacity: 0.5, fontFamily: "'IBM Plex Mono', monospace" }}>Dept</span>
          {["All", ...DEPARTMENTS].map((d) => (
            <button
              key={d}
              onClick={() => setDepartment(d)}
              className="px-2.5 py-1 rounded-full text-[12px] border transition-colors"
              style={{
                background: department === d ? ROUTE_BLUE : "transparent",
                color: department === d ? "#F5F4EF" : INK,
                borderColor: department === d ? ROUTE_BLUE : LINE,
                fontFamily: "'IBM Plex Mono', monospace",
              }}
            >
              {d}
            </button>
          ))}
        </div>
      </div>

      {/* results grid */}
      <div className="px-6 sm:px-10">
        {loadingSheet ? (
          <div className="flex flex-col items-center justify-center gap-2 py-20 text-center">
            <p className="text-[14px]" style={{ color: INK, opacity: 0.6, fontFamily: "'Inter', sans-serif" }}>
              Loading live data from the Sheet...
            </p>
          </div>
        ) : loadError ? (
          <div className="flex flex-col items-center justify-center gap-2 py-20 text-center">
            <p className="text-[14px]" style={{ color: INK, opacity: 0.6, fontFamily: "'Inter', sans-serif" }}>
              Could not load live data. Make sure apps-script-backend.gs is deployed as a Web app,
              and that its URL is pasted into APPS_SCRIPT_URL at the top of this file.
            </p>
          </div>
        ) : filtered.length === 0 ? (
          <div className="flex flex-col items-center justify-center gap-2 py-20 text-center">
            <Building2 size={28} color={INK} style={{ opacity: 0.3 }} />
            <p className="text-[14px]" style={{ color: INK, opacity: 0.6, fontFamily: "'Inter', sans-serif" }}>
              No entries match that search. Try a different brand, site, or date.
            </p>
          </div>
        ) : (
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 pt-2">
            {filtered.map((entry) => (
              <SiteCard key={entry.id} entry={entry} onOpen={setDetail} />
            ))}
          </div>
        )}
      </div>

      <FloatingMenu onSearch={() => searchRef.current?.focus()} onAdd={() => setShowAdd(true)} />
      <DetailPanel entry={detail} onClose={() => setDetail(null)} />
      {showAdd && <AddEntryModal onClose={() => setShowAdd(false)} onSave={handleSave} />}
    </div>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<MonitoringDashboard />);
</script>
</body>
</html>
